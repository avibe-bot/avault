# avault — Rust custody core for Avibe Vaults.
# Workspace: a pure crypto core, a cross-platform key store, and the `avault` binary.
# See docs/DESIGN.md for the full design.

[workspace]
resolver = "2"
members = [
    "crates/avault-core",
    "crates/avault-store",
    "crates/avault-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["The Vibe Remote Authors"]
repository = "https://github.com/avibe-bot/avault"

# Shared, version-pinned crypto stack (see docs/DESIGN.md · Appendix B). Each crate
# opts in via `<dep>.workspace = true`. These are the intended primitives; wiring them
# up is the P1 implementation work.
[workspace.dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }      # AES-256-GCM AEAD
hkdf = "0.12"         # HKDF-SHA256
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }  # deterministic wipe
subtle = "2"          # constant-time comparison
rand = "0.8"          # CSPRNG (OsRng)
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scrypt = "0.11"
libc = "0.2"
tempfile = "3"
security-framework = "2.11"
tss-esapi = { version = "=8.0.0-alpha.1", default-features = false, features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "sha256", "arithmetic"] }
hex = "0.4"

[profile.release]
# Custody binary: keep symbols lean; the memory-hardening lives in code, not flags.
opt-level = 2
