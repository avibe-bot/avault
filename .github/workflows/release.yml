name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: macos-arm64
            rust_target: aarch64-apple-darwin
            os: macos-14
            binary: avault
            strip: true
            required: true
          - target_name: macos-x64
            rust_target: x86_64-apple-darwin
            os: macos-15-intel
            binary: avault
            strip: true
            required: true
          - target_name: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: avault
            strip: true
            required: true
            linux_container: rust:1.86-bullseye
          - target_name: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary: avault
            strip: true
            required: true
            linux_container: rust:1.86-bullseye
          - target_name: windows-x64
            rust_target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: avault.exe
            strip: false
            required: true
          - target_name: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            os: windows-latest
            binary: avault.exe
            strip: false
            required: false
    continue-on-error: ${{ matrix.required == false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from origin/master."
            echo "::error::Merge the release commit to master before pushing a v* tag."
            exit 1
          fi

      - name: Cache cargo registry sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust_target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Linux TPM build dependencies
        if: runner.os == 'Linux'
        run: |
          docker pull "${{ matrix.linux_container }}"

      - name: Install Rust target
        if: runner.os != 'Linux'
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Verify release tag matches crate version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(pkg["version"] for pkg in data["packages"] if pkg["name"] == "avault-cli"))'
          )"
          if [[ "$crate_version" != "$tag_version" ]]; then
            echo "::error::Release tag v${tag_version} does not match avault-cli package version ${crate_version}."
            echo "::error::Bump the workspace package version before tagging so the manifest and binary self-report the same version."
            exit 1
          fi

      - name: Build Linux release binary
        if: runner.os == 'Linux'
        env:
          LINUX_CONTAINER: ${{ matrix.linux_container }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e CARGO_TERM_COLOR=always \
            -e RUST_TARGET \
            -v "$PWD":/work \
            -w /work \
            "$LINUX_CONTAINER" \
            bash -c '
          set -euo pipefail
          . /usr/local/cargo/env
          # Debian 11 left the regular mirrors; its final packages live on
          # archive.debian.org. Keep the bullseye glibc baseline and fetch there.
          sed -i -E "s#^deb http://deb\.debian\.org/debian(-security)? #deb http://archive.debian.org/debian\1 #" /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            autoconf \
            autoconf-archive \
            automake \
            build-essential \
            git \
            libcurl4-openssl-dev \
            libjson-c-dev \
            libltdl-dev \
            libusb-1.0-0-dev \
            libssl-dev \
            libtool \
            pkg-config \
            uuid-dev
          rustup target add "$RUST_TARGET"
          cargo build --locked --release --target "$RUST_TARGET" --bin avault
          chown -R "$(stat -c %u /work):$(stat -c %g /work)" /work/target
          '

      - name: Build release binary
        if: runner.os != 'Linux'
        run: cargo build --locked --release --target "${{ matrix.rust_target }}" --bin avault

      - name: Strip binary
        if: matrix.strip == true
        run: strip "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="avault-${version}-${{ matrix.target_name }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" "dist/${asset}/${{ matrix.binary }}"
          tar -C "dist/${asset}" -czf "dist/${asset}.tar.gz" "${{ matrix.binary }}"
          (
            cd dist
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
            else
              sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
            fi
          )

      - name: Upload unsigned macOS build artifact
        if: startsWith(matrix.target_name, 'macos-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.target_name }}
          path: |
            dist/avault-*.tar.gz
            dist/avault-*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload release artifact
        if: ${{ !startsWith(matrix.target_name, 'macos-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avault-${{ matrix.target_name }}
          path: |
            dist/avault-*.tar.gz
            dist/avault-*.tar.gz.sha256
          if-no-files-found: error

  macos-artifact:
    name: Sign ${{ matrix.target_name }} artifact
    # Signing runs on macOS 26, the release that exports the Developer ID .p12;
    # older runners (macos-14) cannot import a .p12 re-encrypted by OpenSSL 3. One
    # runner per architecture lets the signed binary run natively before publish.
    runs-on: ${{ matrix.os }}
    needs: build
    environment: apple-signing
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: macos-arm64
            os: macos-26
          - target_name: macos-x64
            os: macos-26-intel
    env:
      # Permanent: Keychain approvals bind to this identifier and the Team ID.
      CODESIGN_IDENTIFIER: bot.avibe.avault

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download unsigned macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.target_name }}
          path: unsigned-macos

      - name: Verify and unpack unsigned macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="avault-${version}-${{ matrix.target_name }}"
          (
            cd unsigned-macos
            shasum -a 256 -c "${asset}.tar.gz.sha256"
          )
          mkdir -p "dist/${asset}"
          tar -C "dist/${asset}" -xzf "unsigned-macos/${asset}.tar.gz"

      - name: Require Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # There is no unsigned fallback: a missing or partial credential set
          # fails the release instead of publishing a lesser macOS artifact.
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              missing="${missing} ${name}"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::macOS artifacts must be Developer ID signed and notarized; missing apple-signing environment secrets:${missing}"
            exit 1
          fi
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character Apple Team ID."
            exit 1
          fi
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "*" (${APPLE_TEAM_ID})" ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be 'Developer ID Application: <name> (<APPLE_TEAM_ID>)'."
            exit 1
          fi
          if [[ "$APPLE_API_PRIVATE_KEY" != *"-----BEGIN PRIVATE KEY-----"* ]]; then
            echo "::error::APPLE_API_PRIVATE_KEY must be the raw text of the AuthKey_<key id>.p8 file."
            exit 1
          fi

      - name: Import Developer ID certificate
        # A Keychain prompt would hang this step and signing; fail fast instead.
        timeout-minutes: 10
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/avault-signing.keychain-db"
          certificate="$RUNNER_TEMP/avault-signing.p12"
          keychain_password="$(uuidgen)"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"; then
            echo "::error::APPLE_CERTIFICATE is not valid base64; store the output of: base64 -i DeveloperID.p12"
            exit 1
          fi
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          if ! security import "$certificate" -k "$keychain" -f pkcs12 \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign; then
            echo "::error::Could not import APPLE_CERTIFICATE (security error above). Check APPLE_CERTIFICATE_PASSWORD, and that APPLE_CERTIFICATE is the base64 of the Developer ID Application .p12 exported with its private key."
            exit 1
          fi
          rm -f "$certificate"
          # Let codesign use the private key without a Keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # codesign finds the identity's certificate chain through the search list.
          search_list=()
          while IFS= read -r path; do
            search_list+=("$path")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$keychain" ${search_list[@]+"${search_list[@]}"}
          identities="$(security find-identity -v -p codesigning "$keychain")"
          if ! grep -Fq "\"${APPLE_SIGNING_IDENTITY}\"" <<<"$identities"; then
            echo "::error::APPLE_CERTIFICATE holds no valid code-signing identity named APPLE_SIGNING_IDENTITY. Identities in the .p12:"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi

      - name: Sign macOS binary
        timeout-minutes: 10
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          codesign \
            --force \
            --timestamp \
            --options runtime \
            --identifier "$CODESIGN_IDENTIFIER" \
            --keychain "$RUNNER_TEMP/avault-signing.keychain-db" \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "dist/avault-${version}-${{ matrix.target_name }}/avault"

      - name: Verify code identity
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          build-support/verify-macos-codesign.sh \
            "dist/avault-${version}-${{ matrix.target_name }}/avault" \
            "$CODESIGN_IDENTIFIER" \
            "$APPLE_TEAM_ID"

      - name: Notarize macOS binary
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          api_key="$RUNNER_TEMP/avault-notary-key.p8"
          archive="$RUNNER_TEMP/avault-notarize.zip"
          result="$RUNNER_TEMP/avault-notary-result.json"
          # The subshell's umask creates the key file as mode 600.
          (umask 077 && printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$api_key")
          notary_auth=(--key "$api_key" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          # notarytool takes a zip. A bare Mach-O cannot be stapled; Gatekeeper
          # looks its ticket up online.
          ditto -c -k --keepParent "dist/avault-${version}-${{ matrix.target_name }}/avault" "$archive"
          submit_status=0
          xcrun notarytool submit "$archive" "${notary_auth[@]}" \
            --wait --timeout 1h --output-format json > "$result" || submit_status=$?
          cat "$result"
          # Anything but a JSON status of Accepted, including no JSON at all,
          # fails the release.
          if ! status="$(plutil -extract status raw -o - "$result" 2>/dev/null)"; then
            status=""
          fi
          if [[ "$status" != "Accepted" ]]; then
            echo "::error::Notarization finished with status '${status:-unknown}' (notarytool exit ${submit_status})."
            if submission_id="$(plutil -extract id raw -o - "$result" 2>/dev/null)"; then
              xcrun notarytool log "$submission_id" "${notary_auth[@]}" || true
            fi
            exit 1
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/avault-signing.keychain-db"
          # delete-keychain also drops the keychain from the user search list.
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f \
            "$RUNNER_TEMP/avault-signing.p12" \
            "$RUNNER_TEMP/avault-notary-key.p8" \
            "$RUNNER_TEMP/avault-notarize.zip" \
            "$RUNNER_TEMP/avault-notary-result.json"

      - name: Run signed binary
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          reported="$("dist/avault-${version}-${{ matrix.target_name }}/avault" --version)"
          if [[ "$reported" != "avault ${version}" ]]; then
            echo "::error::Signed binary reported '${reported}', expected 'avault ${version}'."
            exit 1
          fi

      - name: Package macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="avault-${version}-${{ matrix.target_name }}"
          mkdir -p dist-final
          tar -C "dist/${asset}" -czf "dist-final/${asset}.tar.gz" avault
          (
            cd dist-final
            shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
          )

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avault-${{ matrix.target_name }}
          path: |
            dist-final/avault-*.tar.gz
            dist-final/avault-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - macos-artifact
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: avault-*
          path: dist
          merge-multiple: true

      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          dist = Path("dist")
          required_targets = {
              "macos-arm64",
              "macos-x64",
              "linux-x64",
              "linux-arm64",
              "windows-x64",
          }
          targets = {}

          prefix = f"avault-{version}-"
          suffix = ".tar.gz"
          for asset_path in sorted(dist.glob(f"{prefix}*{suffix}")):
              asset = asset_path.name
              target = asset.removeprefix(prefix).removesuffix(suffix)
              sha_path = dist / f"{asset}.sha256"
              digest = sha_path.read_text(encoding="utf-8").split()[0]
              targets[target] = {
                  "asset": asset,
                  "sha256": digest,
              }

          missing = sorted(required_targets - targets.keys())
          if missing:
              raise SystemExit(f"missing required release targets: {', '.join(missing)}")

          manifest = {
              "schema_version": 1,
              "versions": {
                  version: targets,
              },
          }
          (dist / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: avault ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/avault-*.tar.gz
            dist/avault-*.tar.gz.sha256
            dist/manifest.json
